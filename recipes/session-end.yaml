version: "1.0.0"
title: "Cerrar sesión — guardar resumen persistente"
description: |
  Genera un resumen de la sesión actual y lo persiste en PostgreSQL via lina-db.
  Llamar al final de cada sesión de trabajo o cuando Federico lo pida explícitamente.

instructions: |
  Seguí estos pasos en orden:

  1. **Determiná el session_id** de la sesión activa de Telegram. El formato es
     `telegram-{chat_id}` (ej: `telegram-123456789`). El `chat_id` es el ID numérico
     del chat de Telegram visible en el contexto de la conversación actual.
     **No uses `get_last_sessions(1)`** — esa función devuelve IDs en formato
     `YYYYMMDD_N` (tabla legacy) que NO coinciden con el formato que usa `summarize_session_smart`.

  2. **Generá el resumen** de la sesión en formato estructurado:
     - Temas tratados (lista de bullets concisos)
     - Tareas completadas
     - Decisiones técnicas relevantes
     - Archivos/repos modificados (si aplica)
     El resumen debe caber en ~300 palabras. Priorizá lo accionable.

  3. **Extraé metadatos** para el resumen estructurado:
     - `topics`: lista de temas principales (máx 5, ej: ["deploy gateway", "Moodle M2-R7"])
     - `facts`: datos puntuales a recordar en sesiones futuras (ej: ["número favorito = 42"])
     - `pending`: tareas no completadas que deben retomarse (ej: ["revisar PR #60"])

  4. **Persistí el resumen estructurado** llamando a:
     `summarize_session_smart(session_id, raw_summary, topics, facts, pending)`

     Además, si el `session_id` tiene formato `telegram-...`, también llamá al
     método legacy:
     `summarize_session(session_id_legacy, raw_summary)` donde `session_id_legacy`
     tiene formato `YYYYMMDD_N` (para compatibilidad con `get_last_sessions`).

  5. **Confirmá** con un mensaje breve:
     <b>✅ Sesión guardada.</b>
     Topics: [lista]
     Pendientes: [lista o "ninguno"]

  <b>Restricciones:</b>
  - Si lina-db no está disponible, mostrá el resumen igual pero avisá: "⚠️ No se guardó en DB."
  - No incluyas secrets, tokens ni datos personales en el resumen.
