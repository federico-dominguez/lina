version: "1.0.0"
title: "Cerrar sesión — guardar resumen persistente"
description: |
  Genera un resumen de la sesión actual y lo persiste en PostgreSQL via lina-db.
  Llamar al final de cada sesión de trabajo o cuando Federico lo pida explícitamente.

instructions: |
  Seguí estos pasos en orden:

  1. **Generá el resumen** de la sesión actual en formato estructurado:
     - Fecha/hora (usar timestamp del último mensaje)
     - Temas tratados (lista de bullets concisos)
     - Tareas completadas
     - Pendientes o bloqueos identificados
     - Decisiones técnicas relevantes (si las hubo)
     - Archivos/repos modificados (si aplica)

     El resumen debe caber en ~300 palabras. Priorizá lo accionable.

  2. **Determiná el session_id** con formato `YYYYMMDD_N` donde N es un número
     secuencial para el día (usá `get_last_sessions(1)` para ver el último y
     calcular el siguiente). Si no hay sesiones previas del día, usá `_1`.

  3. **Persistí el resumen** llamando a `summarize_session(session_id, summary)`.

  4. **Confirmá** con un mensaje breve:
     <b>✅ Sesión [session_id] guardada.</b>
     [preview de 2 líneas del resumen]

  <b>Restricciones:</b>
  - Si lina-db no está disponible, mostrá el resumen igual pero avisá que no
    se pudo persistir: "⚠️ No se guardó en DB — lina-db no disponible."
  - No incluyas secrets, tokens ni datos personales en el resumen.
