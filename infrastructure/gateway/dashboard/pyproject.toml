[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lina-dashboard"
version = "0.1.0"
description = "LINA Monitoring Dashboard — bots, sesiones, contenedores y MCPs"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "anyio>=4.4",
    "psycopg2-binary>=2.9",
]

[project.scripts]
lina-dashboard = "lina_dashboard.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lina_dashboard"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
dev-dependencies = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
]
