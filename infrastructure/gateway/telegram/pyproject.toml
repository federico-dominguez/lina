[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lina-gateway"
version = "0.1.0"
description = "LINA Telegram gateway — standalone Python service that bridges Telegram and goosed"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "anyio>=4.4",
    "markdown-it-py>=3.0",
    # Optional: used by boot_hook.py when LINA_DB_URL is set.
    # Declared as a hard dependency so the image always has it available.
    "asyncpg>=0.29",
    "google-genai>=2.0.0",
    "gtts>=2.5",
    "pyyaml>=6.0.3",
    "telethon>=1.43.2",
]

[project.scripts]
lina-gateway = "lina_gateway.__main__:main"
lina-trace-persist = "lina_gateway.trace_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lina_gateway"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]  # line length enforced by ruff format, not lint

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
dev-dependencies = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-httpx>=0.36.2",
    "ruff>=0.15.15",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "pytest-cov>=5",
    "ruff>=0.4",
    "coverage>=7",
]
