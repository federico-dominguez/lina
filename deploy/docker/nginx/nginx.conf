# LINA — MCP Gateway (nginx)
# Rate limiting por servicio + proxy reverso para todos los MCPs.
#
# Límites (requests/minuto por IP de origen):
#   shell-policy : 30  rpm  (comandos de shell — operación costosa/riesgosa)
#   moodle       : 20  rpm  (API externa con rate limit propio)
#   resto        : 120 rpm  (lectura/escritura interna)
#
# Conexiones SSE (text/event-stream) son long-lived; el rate limit aplica
# al momento de establecer la conexión, no por evento enviado.

worker_processes 1;

events {
    worker_connections 256;
}

http {
    # ─── Rate limit zones ────────────────────────────────────────────────────
    # Zona "default" — MCPs de baja criticidad (120 req/min por IP)
    limit_req_zone $binary_remote_addr zone=mcp_default:10m rate=120r/m;
    # Zona "shell" — shell-policy (30 req/min por IP)
    limit_req_zone $binary_remote_addr zone=mcp_shell:10m   rate=30r/m;
    # Zona "moodle" — MCP de Moodle (20 req/min por IP)
    limit_req_zone $binary_remote_addr zone=mcp_moodle:10m  rate=20r/m;

    # ─── Logging a stdout/stderr (container-native) ──────────────────────────
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # ─── Proxy defaults para SSE ─────────────────────────────────────────────
    # SSE requiere: sin buffering, HTTP/1.1, Connection: '' vacío.
    proxy_http_version  1.1;
    proxy_set_header    Connection "";
    proxy_set_header    Host $host;
    proxy_set_header    X-Real-IP $remote_addr;
    proxy_read_timeout  3600s;   # conexiones SSE son long-lived
    proxy_send_timeout  3600s;
    proxy_buffering     off;
    proxy_cache         off;

    # ─── :8101 — lina-secrets ────────────────────────────────────────────────
    server {
        listen 8101;
        location / {
            limit_req zone=mcp_default burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://lina-mcp-secrets:8000;
        }
    }

    # ─── :8102 — lina-fs-safe ────────────────────────────────────────────────
    server {
        listen 8102;
        location / {
            limit_req zone=mcp_default burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://lina-mcp-fs-safe:8000;
        }
    }

    # ─── :8103 — lina-shell-policy (límite estricto) ─────────────────────────
    server {
        listen 8103;
        location / {
            limit_req zone=mcp_shell burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://lina-mcp-shell-policy:8000;
        }
    }

    # ─── :8104 — lina-systemd-user ───────────────────────────────────────────
    server {
        listen 8104;
        location / {
            limit_req zone=mcp_default burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://lina-mcp-systemd-user:8000;
        }
    }

    # ─── :8105 — lina-moodle (límite estricto) ───────────────────────────────
    server {
        listen 8105;
        location / {
            limit_req zone=mcp_moodle burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://lina-mcp-moodle:8000;
        }
    }

    # ─── :8106 — lina-db ─────────────────────────────────────────────────────
    server {
        listen 8106;
        location / {
            limit_req zone=mcp_default burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://lina-mcp-db:8000;
        }
    }
}
