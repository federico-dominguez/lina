# LINA — MCP Gateway (nginx)
# Rate limiting por servicio + proxy reverso para todos los MCPs.
#
# Límites (requests/minuto por IP de origen):
#   shell-policy : 30  rpm  (comandos de shell — operación costosa/riesgosa)
#   moodle       : 20  rpm  (API externa con rate limit propio)
#   resto        : 120 rpm  (lectura/escritura interna)
#
# burst=50 en mcp_default: goosed inicializa ~10 extensiones en paralelo
# enviando 2 requests cada una (initialize + list_tools) = 20 burst mínimo.
# Se usa 50 para dejar margen ante recargas de tool list y retries.
#
# Protocolo: MCP Streamable HTTP (POST /mcp).
# goosed >= 1.35 requiere streamable_http; SSE fue deprecado.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ─── Rate limit zones ────────────────────────────────────────────────────
    # Zona "default" — MCPs de baja criticidad (120 req/min por IP)
    limit_req_zone $binary_remote_addr zone=mcp_default:10m rate=120r/m;
    # Zona "shell" — shell-policy (30 req/min por IP)
    limit_req_zone $binary_remote_addr zone=mcp_shell:10m   rate=30r/m;
    # Zona "moodle" — MCP de Moodle (20 req/min por IP)
    limit_req_zone $binary_remote_addr zone=mcp_moodle:10m  rate=20r/m;

    # ─── Logging a stdout/stderr (container-native) ──────────────────────────
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # ─── Proxy defaults para streamable_http ─────────────────────────────────
    # MCP Streamable HTTP usa POST/GET regulares; timeout generoso para ops largas.
    proxy_http_version  1.1;
    proxy_set_header    Host $host;
    proxy_set_header    X-Real-IP $remote_addr;
    proxy_read_timeout  120s;
    proxy_send_timeout  30s;
    proxy_buffering     off;
    proxy_cache         off;

    # ─── :8101 — lina-secrets ────────────────────────────────────────────────
    server {
        listen 8101;
        location / {
            limit_req zone=mcp_default burst=50 nodelay;
            limit_req_status 429;
            proxy_pass http://lina-mcp-secrets:8000;
        }
    }

    # ─── :8102 — lina-fs-safe ────────────────────────────────────────────────
    server {
        listen 8102;
