# LINA — Docker Compose
# Levanta PostgreSQL + goosed con todos los MCPs.
#
# Uso rápido:
#   just docker-up          # arranca en background
#   just docker-down        # detiene y remueve contenedores
#   just docker-logs        # tail logs de goosed
#
# Variables de entorno opcionales (sobreescribir en .env):
#   POSTGRES_PASSWORD   (default: lina_dev  — cambiar en producción)
#   LINA_DB_URL         (default: postgresql://lina:<POSTGRES_PASSWORD>@lina-db:5432/lina)

# ─── Defaults compartidos para todos los MCPs (Fase 3 hardening) ────────────
# Aplicar con <<: *mcp-defaults en cada servicio MCP.
# Servicios pueden sobrescribir claves individuales después del merge.
x-mcp-defaults: &mcp-defaults
  restart: unless-stopped
  read_only: true               # FS del contenedor inmutable; volúmenes siguen rw
  security_opt:
    - no-new-privileges:true   # impide sudo/setuid post-exec
  cap_drop:
    - ALL                       # sin capabilities; añadir cap_add sólo si se justifica
  tmpfs:
    - /tmp:size=64m             # /tmp writable (Python, FastMCP temporales)
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  # ── Memory limits (Issue #160: evitar OOM Killer) ─────────────────────────
  # MCPs livianos — threshold seguro para evitar fugas.
  mem_limit: 512m
  memswap_limit: 512m
  oom_kill_disable: false       # permitir que Docker OOM-kille si excede

services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  lina-db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    shm_size: 256mb       # pgvector requiere shared memory para indices IVFFlat
    environment:
      POSTGRES_USER: lina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lina_dev}
      POSTGRES_DB: lina
    volumes:
      - lina-db-data:/var/lib/postgresql/data
      - ../../sql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lina -d lina"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # ── Memory limits: DB con datos puede crecer, pero no descontrolarse
    mem_limit: 1g
    memswap_limit: 1g

  # ─── goosed runtime ─────────────────────────────────────────────────────────
  # Imagen buildeada desde el binario patched + MCPs Python.
  # Para rebuild: cp ~/goosed_patched bin/goosed-linux-amd64 && docker compose build goosed
  lina-goosed:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.goosed
      args:
        AGENT_PERSONALITY: lina
    image: lina-goosed:latest
    container_name: lina-goosed
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      lina-db:
        condition: service_healthy
      lina-mcp-gateway:
        condition: service_started
    environment:
      LINA_DB_URL: postgresql://lina:${POSTGRES_PASSWORD:-lina_dev}@lina-db:5432/lina
      COMM_SENDER: "lina"
      LINA_SECRET_KEY: ${LINA_SECRET_KEY:-${GOOSE_SERVER__SECRET_KEY:-}}
      # goosed binary expects GOOSE_SERVER_SECRET_KEY (or GOOSE_SERVER__SECRET_KEY)
      GOOSE_SERVER__SECRET_KEY: ${LINA_SECRET_KEY:-${GOOSE_SERVER__SECRET_KEY:-}}
      GOOSE_HOST: "0.0.0.0"
      GOOSE_MAX_TURNS: ${GOOSE_MAX_TURNS:-1000}
      GOOSE_GATEWAY_MAX_TURNS: ${GOOSE_GATEWAY_MAX_TURNS:-50}
      GOOSE_SUBAGENT_MAX_TURNS: ${GOOSE_SUBAGENT_MAX_TURNS:-200}
      GOOSE_CONTEXT_STRATEGY: ${GOOSE_CONTEXT_STRATEGY:-summarize}
      GOOSE_TELEMETRY_ENABLED: "false"
      GOOSE_DISABLE_AUTO_SESSION_TITLES: "true"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      LINA_ENV: docker
    volumes:
      # Config específica para Docker (MCPs via SSE, sin gateway Rust)
      - ../../config/goose.config.docker.yaml:/root/.config/goose/config.yaml:ro
      # Sessions y memoria persistentes del host
      - ${HOME}/.config/goose/memory:/root/.config/goose/memory:rw
      - ${HOME}/.config/goose/gateway:/root/.config/goose/gateway:rw
      - lina-logs:/app/logs
      # Acceso al repo lina para git autonomo.
      # La deploy key (~/lina/.ssh/lina_deploy) debe estar creada y con write
      # access al repo — ver docs/runbooks/ para el procedimiento de setup.
      - ${HOME}:/home/user:rw
      - lina-goosed-sessions:/root/.local/share/goose/sessions:rw
      # Solo la deploy key dedicada al repo lina (NO todo ~/.ssh).
      # Crear con: ssh-keygen -t ed25519 -f ~/lina/.ssh/lina_deploy -N ''
      # Agregar la clave pública como Deploy Key con write access en GitHub.
      - ${HOME}/lina/.ssh/lina_deploy:/root/.ssh/id_ed25519:ro
      - ${HOME}/lina/.ssh/lina_deploy.pub:/root/.ssh/id_ed25519.pub:ro
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sfk -H \"x-secret-key: ${GOOSE_SERVER__SECRET_KEY}\" https://localhost:3000/status"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # ── Memory limits: goosed con contexto puede crecer; tope amplio
    mem_limit: 2g
    memswap_limit: 2g

  # ─── goosed (modo dev, binario montado desde host) ──────────────────────────
  goosed-dev:
    image: lina-goosed:latest
    profiles: ["dev"]
    restart: "no"
    depends_on:
      lina-db:
        condition: service_healthy
    environment:
      LINA_DB_URL: postgresql://lina:${POSTGRES_PASSWORD:-lina_dev}@lina-db:5432/lina
    env_file:
      - path: ../../.env
        required: false
    volumes:
      - ${GOOSED_BIN:-/usr/local/bin/goosed}:/usr/local/bin/goosed:ro
      - ${HOME}/.config/goose:/root/.config/goose:ro
      - lina-logs:/app/logs
    # ── Memory limits
    mem_limit: 2g
    memswap_limit: 2g

  # ─── MCP: lina-secrets ──────────────────────────────────────────────────────
  # Backend: archivo en volumen (libsecret no funciona en containers).
  lina-mcp-secrets:
    <<: *mcp-defaults
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.mcp
      args:
        MCP_DIR: mcps/secrets
        MCP_CMD: lina-secrets
    image: lina-mcp-secrets:latest
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_PORT: "8000"
      LINA_SECRETS_BACKEND: file
      LINA_SECRETS_FILE_DIR: /run/secrets/lina
    volumes:
      - lina-secrets-data:/run/secrets/lina
    # Sin ports: — acceso exclusivo via lina-mcp-gateway (3.3)

  # ─── MCP: lina-fs-safe ──────────────────────────────────────────────────────
  lina-mcp-fs-safe:
    <<: *mcp-defaults
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.mcp
      args:
        MCP_DIR: mcps/fs-safe
        MCP_CMD: lina-fs-safe
    image: lina-mcp-fs-safe:latest
    # Corre con el mismo UID del host para poder leer/escribir $HOME (0700).
    user: "${UID:-1000}"
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_PORT: "8000"
      HOME: /home/user
      LINA_FS_AUDIT_DIR: /home/user/lina/logs
    volumes:
      - ${HOME}:/home/user:rw

  # ─── MCP: lina-shell-policy ─────────────────────────────────────────────────
  lina-mcp-shell-policy:
    <<: *mcp-defaults
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.mcp
      args:
        MCP_DIR: mcps/shell-policy
        MCP_CMD: lina-shell-policy
        MCP_SUDO_ENABLED: "1"  # Instalar sudo solo para este MCP
    image: lina-mcp-shell-policy:latest
    # shell-policy es el MCP privilegiado de LINA.
    # Necesita setuid para sudo (no-new-privileges debe estar desactivado).
    # Corre como uid 1000 para poder leer/escribir /home/user montado desde el host.
    security_opt:
      - no-new-privileges:false
    # cap_drop:ALL heredado de mcp-defaults elimina todas las capabilities.
    # Agregamos de vuelta solo las necesarias para sudo:
    #   SETUID / SETGID  — sudo cambia uid/gid a root
    # (sudoers_audit está desactivado en /etc/sudo.conf — AUDIT_WRITE no es necesario)
    cap_add:
      - SETUID
      - SETGID
    user: "${UID:-1000}"
    depends_on:
      - lina-docker-proxy
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_PORT: "8000"
      LINA_SHELL_AUDIT_DIR: /tmp/lina-audit
      # Habilita comandos privilegiados (apt, sudo allowlist) — requiere además
      # allow_sudo=True en cada llamada a sh_run para activarse.
      LINA_SHELL_ALLOW_SUDO: "1"
      # Docker management via socket proxy (sin acceso al socket completo).
      DOCKER_HOST: tcp://lina-docker-proxy:2375
    volumes:
      - ${HOME}:/home/user:rw
    networks:
      - default
      - lina-docker-proxy-net

  # ─── MCP: lina-systemd-user ─────────────────────────────────────────────────
  # Requiere D-Bus socket del usuario host.
  lina-mcp-systemd-user:
    <<: *mcp-defaults
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.mcp
      args:
        MCP_DIR: mcps/systemd-user
        MCP_CMD: lina-systemd-user
    image: lina-mcp-systemd-user:latest
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_PORT: "8000"
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
    user: "1000"
    volumes:
      - /run/user/1000/bus:/run/user/1000/bus:rw

  # ─── MCP: lina-moodle ───────────────────────────────────────────────────────
  lina-mcp-moodle:
    <<: *mcp-defaults
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.mcp
      args:
        MCP_DIR: mcps/moodle
        MCP_CMD: lina-moodle
    image: lina-mcp-moodle:latest
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_PORT: "8000"
      MOODLE_URL: ${MOODLE_URL:-https://ev1.utec.edu.uy/moodle}
      MOODLE_USERNAME: ${MOODLE_USERNAME:-}
      MOODLE_PASSWORD: ${MOODLE_PASSWORD:-}
    networks:
      - default
      - lina-moodle-net

  # ─── MCP: lina-db ───────────────────────────────────────────────────────────
  lina-mcp-db:
    <<: *mcp-defaults
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.mcp
      args:
        MCP_DIR: mcps/lina-db
        MCP_CMD: lina-db
    image: lina-mcp-db:latest
    depends_on:
      lina-db:
        condition: service_healthy
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_PORT: "8000"
      LINA_DB_URL: postgresql://lina:${POSTGRES_PASSWORD:-lina_dev}@lina-db:5432/lina
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_PLATFORM_TOKEN: ${DEEPSEEK_PLATFORM_TOKEN:-}

  # ─── MCP: lina-knowledge ─────────────────────────────────────────────────
  lina-mcp-knowledge:
    <<: *mcp-defaults
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.mcp
      args:
        MCP_DIR: mcps/lina-knowledge
        MCP_CMD: lina-knowledge
    image: lina-mcp-knowledge:latest
    depends_on:
      lina-db:
        condition: service_healthy
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_PORT: "8000"
      LINA_DB_URL: postgresql://lina:${POSTGRES_PASSWORD:-lina_dev}@lina-db:5432/lina
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}

  # ─── MCP: lina-github ──────────────────────────────────────────────────────
  lina-mcp-github:
    <<: *mcp-defaults
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.mcp
      args:
        MCP_DIR: mcps/github
        MCP_CMD: lina-github
    image: lina-mcp-github:latest
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_PORT: "8000"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

  # ─── MCP: lina-gitlab ──────────────────────────────────────────────────────
  lina-mcp-gitlab:
    <<: *mcp-defaults
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.mcp
      args:
        MCP_DIR: mcps/gitlab
        MCP_CMD: lina-gitlab
    image: lina-mcp-gitlab:latest
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_PORT: "8000"
      GITLAB_URL: ${GITLAB_URL:-https://git.utec.edu.uy}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}

  # ─── MCP: lina-gcalendar ────────────────────────────────────────────────────
  # credentials.json se monta desde el host; token.json se persiste en volumen.
  lina-mcp-gcalendar:
    <<: *mcp-defaults
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.mcp
      args:
        MCP_DIR: mcps/gcalendar
        MCP_CMD: lina-gcalendar
    image: lina-mcp-gcalendar:latest
    read_only: false          # necesita escribir token.json en /run/gcalendar/
    user: "${UID:-1000}"      # el proceso debe correr con el mismo UID que posee los archivos
                              # del volumen lina-gcalendar-token; setear UID en el entorno si difiere de 1000
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_PORT: "8000"
      GCALENDAR_CREDENTIALS_FILE: /run/gcalendar/credentials.json
      GCALENDAR_TOKEN_FILE: /run/gcalendar/token.json
    volumes:
      - ${GCALENDAR_CREDENTIALS_FILE:-/dev/null}:/run/gcalendar/credentials.json:ro
      - lina-gcalendar-token:/run/gcalendar

  # ─── MCP: lina-gns3 ─────────────────────────────────────────────────────────
  # GNS3 corre en el host en localhost:3080; usa extra_hosts para alcanzarlo.
  lina-mcp-gns3:
    <<: *mcp-defaults
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.mcp
      args:
        MCP_DIR: mcps/gns3
        MCP_CMD: lina-gns3
    image: lina-mcp-gns3:latest
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_PORT: "8000"
      GNS3_HOST: ${GNS3_HOST:-host.docker.internal}
      GNS3_PORT: ${GNS3_PORT:-3080}
      GNS3_USER: ${GNS3_USER:-}
      GNS3_PASSWORD: ${GNS3_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─── MCP: lina-orchestrator ─────────────────────────────────────────────────
  # Multi-agent orchestrator: expone políticas de subagentes + watchdog de
  # timeouts + spawn de sub-agentes goosed como procesos hijos (issues #84, #89).
  #
  # ⚠️  WATCHDOG DUAL: El sistema tiene dos watchdogs complementarios:
  #    1. lina-watchdog.service (host systemd) → monitorea container lina-goosed
  #       via Docker healthcheck. Corre en el HOST (no en container).
  #    2. Watchdog interno (in-process) → thread daemon en SpawnerService.
  #       Monitorea sub-agentes goosed hijos y los mata si exceden
  #       max_runtime_minutes según la política del rol.
  #    Son complementarios, no duplicados. Ver docs/architecture/ para detalle.
  #
  # 🟢  HARDENING: Este MCP es read-only y no tiene acceso a fs-safe ni
  #     shell-policy. Solo spawna procesos goosed hijos con configs filtradas
  #     según policies.yaml.
  lina-mcp-orchestrator:
    <<: *mcp-defaults
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.mcp
      args:
        MCP_DIR: mcps/orchestrator
        MCP_CMD: lina-orchestrator
    image: lina-mcp-orchestrator:latest
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_PORT: "8000"
      LINA_POLICIES_FILE: /home/user/lina/config/policies.yaml
      LINA_DB_URL: postgresql://lina:${POSTGRES_PASSWORD:-lina_dev}@lina-db:5432/lina
      LINA_GOOSED_URL: https://lina-goosed:3000
      LINA_GOOSED_SECRET: ${GOOSE_SERVER__SECRET_KEY:-}
      # ── Sub-agent spawning ────────────────────────────────────────────────
      # Ruta al binario goosed dentro del container (necesario para spawn).
      # Si cambia la versión en Dockerfile.goosed, actualizar acá también.
      LINA_GOOSED_BIN: /usr/local/bin/goosed
      # Config base de goosed que se filtra por rol para generar las configs
      # temporales de los sub-agentes (solo MCPs permitidos).
      LINA_BASE_GOOSE_CONFIG: /root/.config/goose/config.yaml
      # ── Watchdog de timeouts (opcionales, mostrar valores por defecto) ────
      LINA_WATCHDOG_INTERVAL: ${LINA_WATCHDOG_INTERVAL:-30}
      LINA_WATCHDOG_MAX_ERRORS: ${LINA_WATCHDOG_MAX_ERRORS:-5}
    volumes:
      - ../../config/policies.yaml:/home/user/lina/config/policies.yaml:ro
      # Base config de goosed (para filtrar MCPs por rol en sub-agentes)
      - ../../config/goose.config.docker.yaml:/root/.config/goose/config.yaml:ro
      # Binario goosed para spawnear sub-agentes (mismo que usa lina-goosed)
      - /usr/local/bin/goosed:/usr/local/bin/goosed:ro

  # ─── MCP Gateway — nginx rate limiting (3.3) ────────────────────────────────
  # Proxy reverso para todos los MCPs. Expone 8101-8110 en localhost.
  # Los MCPs no tienen port mappings propios; sólo son accesibles via este gateway.
  # Límites: shell-policy 30 req/min, moodle 20 req/min, resto 120 req/min.
  lina-mcp-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      - lina-mcp-secrets
      - lina-mcp-fs-safe
      - lina-mcp-shell-policy
      - lina-mcp-systemd-user
      - lina-mcp-moodle
      - lina-mcp-db
      - lina-mcp-knowledge
      - lina-mcp-github
      - lina-mcp-gitlab
      - lina-mcp-gcalendar
      - lina-mcp-gns3
      - lina-mcp-orchestrator
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8101:8101"
      - "127.0.0.1:8102:8102"
      - "127.0.0.1:8103:8103"
      - "127.0.0.1:8104:8104"
      - "127.0.0.1:8105:8105"
      - "127.0.0.1:8106:8106"
      - "127.0.0.1:8107:8107"
      - "127.0.0.1:8108:8108"
      - "127.0.0.1:8109:8109"
      - "127.0.0.1:8110:8110"
      - "127.0.0.1:8112:8112"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # ── nginx es liviano
    mem_limit: 128m
    memswap_limit: 128m

  # ─── Backup automático (3.6) ─────────────────────────────────────────────────
  # Ejecuta pg_dump horario. Retiene las últimas 24 copias (= 1 día).
  # Los backups se almacenan comprimidos en el volumen lina-backup-data.
  lina-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      lina-db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-lina_dev}
      PGHOST: lina-db
      PGUSER: lina
      PGDATABASE: lina
    volumes:
      - lina-backup-data:/backups
      - ./backup/backup.sh:/usr/local/bin/lina-backup:ro
    command: >
      sh -c "while true; do sh /usr/local/bin/lina-backup; sleep 3600; done"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    # ── backup es liviano
    mem_limit: 256m
    memswap_limit: 256m

  # ─── CLINE Desktop — goosed con acceso total a la PC ────────────────────────
  # Contenedor privileged con host network para acceso total al sistema.
  # Comparte los MCPs de LINA vía localhost (host network).
  # Escucha en puerto 3001 para no colisionar con LINA (puerto 3000).
  cline-goosed-dev:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.goosed
      args:
        AGENT_PERSONALITY: cline
    image: cline-goosed:latest
    container_name: cline-goosed
    restart: unless-stopped

    privileged: true               # acceso completo al host
    network_mode: host             # red del host (localhost funciona directo)
    pid: host                      # ver todos los procesos del host
    depends_on:
      lina-mcp-gateway:
        condition: service_started
    environment:
      LINA_DB_URL: postgresql://lina:${POSTGRES_PASSWORD:-lina_dev}@localhost:5432/lina
      COMM_SENDER: "cline"
      LINA_SECRET_KEY: ${LINA_SECRET_KEY:-${GOOSE_SERVER__SECRET_KEY:-}}
      # goosed binary expects GOOSE_SERVER__SECRET_KEY for /agent/start auth
      GOOSE_SERVER__SECRET_KEY: ${LINA_SECRET_KEY:-${GOOSE_SERVER__SECRET_KEY:-}}
      GOOSE_PORT: "3001"
      GOOSE_HOST: "127.0.0.1"
      GOOSE_MAX_TURNS: ${GOOSE_MAX_TURNS:-1000}
      GOOSE_GATEWAY_MAX_TURNS: ${GOOSE_GATEWAY_MAX_TURNS:-50}
      GOOSE_SUBAGENT_MAX_TURNS: ${GOOSE_SUBAGENT_MAX_TURNS:-200}
      GOOSE_CONTEXT_STRATEGY: ${GOOSE_CONTEXT_STRATEGY:-summarize}
      GOOSE_TELEMETRY_ENABLED: "false"
      GOOSE_DISABLE_AUTO_SESSION_TITLES: "true"
      # GOOSE_THINKING_EFFORT: "true"  # desactivado 2026-06-03 — unificar thinking con LINA
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      LINA_ENV: docker
    volumes:
      # Config específica para desktop (MCPs via localhost, sin gateway nginx interno)
      - ../../config/goose.config.desktop.yaml:/root/.config/goose/config.yaml:ro
      # Sessions y memoria persistentes
      - ${HOME}/.config/goose/memory-desktop:/root/.config/goose/memory:rw  # CLINE desktop (separado de LINA)
      - ${HOME}/.config/goose/gateway-desktop:/root/.config/goose/gateway:rw  # CLINE desktop (separado de LINA)
      - lina-logs:/app/logs
      # Acceso total al home del usuario
      - ${HOME}:/home/user:rw
      # Docker socket para control de contenedores
      - /var/run/docker.sock:/var/run/docker.sock:rw
    # Sin healthcheck — privileged + host network puede causar falsos negativos
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    profiles: ["desktop"]
    # ── Memory limits: cline-goosed con contexto grande
    mem_limit: 2g
    memswap_limit: 2g

  # ─── gemma-goosed ────────────────────────────────────────────────────────────
  gemma-goosed:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.goosed
      args:
        AGENT_PERSONALITY: gemma
    image: gemma-goosed:latest
    container_name: gemma-goosed
    restart: unless-stopped
    depends_on:
      lina-db:
        condition: service_healthy
    environment:
      LINA_DB_URL: postgresql://lina:${POSTGRES_PASSWORD:-lina_dev}@lina-db:5432/lina
      COMM_SENDER: "gemma"
      LINA_SECRET_KEY: ${GEMMA_SECRET_KEY:-}
      GOOSE_SERVER__SECRET_KEY: ${GEMMA_SECRET_KEY:-}
      GOOSE_PORT: "3002"
      GOOSE_HOST: "0.0.0.0"
      GOOSE_MAX_TURNS: ${GOOSE_MAX_TURNS:-1000}
      GOOSE_GATEWAY_MAX_TURNS: ${GOOSE_GATEWAY_MAX_TURNS:-50}
      GOOSE_SUBAGENT_MAX_TURNS: ${GOOSE_SUBAGENT_MAX_TURNS:-200}
      GOOSE_CONTEXT_STRATEGY: ${GOOSE_CONTEXT_STRATEGY:-summarize}
      GOOSE_TELEMETRY_ENABLED: "false"
      GOOSE_DISABLE_AUTO_SESSION_TITLES: "true"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      LINA_ENV: docker
    volumes:
      - ../../config/goose.config.gemma.yaml:/root/.config/goose/config.yaml:ro
      - ${HOME}/.config/goose/memory-gemma:/root/.config/goose/memory:rw
      - ${HOME}/.config/goose/gateway-gemma:/root/.config/goose/gateway:rw
      - lina-logs:/app/logs
      - ${HOME}:/home/user:rw
      - /var/run/docker.sock:/var/run/docker.sock:rw
    ports:
      - "127.0.0.1:3002:3002"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    mem_limit: 2g
    memswap_limit: 2g
    profiles: ["all"]


  # ─── [DEPRECATED] Telegram Gateway Docker — reemplazado por host-native ──
  # Ya no se usa. Reemplazado por:
  #   - goose-gateway.service    (systemd, solo @s_goose_bot)
  #   - lina-gateway-host.service (systemd, LINA + CLINE + Gemma)
  #
  # Los gateways host-native evitan el crash sin TTY (signal handler),
  # eliminan la dependencia de host.docker.internal, y son más resilientes.
  # Mantener solo como referencia; no arranca por defecto (profile: deprecated).
  lina-gateway:
    profiles: ["deprecated"]   # No arranca por defecto — usar host-native
    container_name: lina-gateway
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.gateway
    image: lina-gateway:latest
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      lina-db:
        condition: service_healthy
      lina-goosed:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"  # alcanzar cline-goosed y goose local
    environment:
      # ── Multi-bot mode: 4 bots (LINA + CLINE + GOOSE + Gemma) ───────────────
      # ⚠️  DEPRECATED: El gateway Docker no se usa más.
      #     Ver lina-gateway-host.service (host-native, 3 bots) y
      #     goose-gateway.service (host-native, solo goose).
      MULTI_BOT_COUNT: "4"

      # Bot 1 — LINA → lina-goosed (Docker network)
      BOT_1_NAME: "LINA"
      BOT_1_USERNAME: "s_lina_bot"
      BOT_1_TOKEN: ${LINA_BOT_TOKEN:-${TELEGRAM_BOT_TOKEN:-}}
      BOT_1_GOOSED_URL: "https://lina-goosed:3000"
      BOT_1_GOOSED_SECRET: ${LINA_SECRET_KEY:-${GOOSE_SERVER__SECRET_KEY:-}}
      BOT_1_TRUSTED_USERS: ${LINA_TRUSTED_USERS:-${GOOSE_GATEWAY_TRUSTED_USERS:-}}
      BOT_1_NOTIFY_CHAT_IDS: ${LINA_NOTIFY_CHAT_IDS:-${GATEWAY_NOTIFY_CHAT_IDS:-}}
      BOT_1_OBSERVE_PORT: "9093"

      # Bot 2 — Cline → cline-goosed (host network via host.docker.internal:3001)
      BOT_2_NAME: "Cline"
      BOT_2_USERNAME: "s_cline_bot"
      BOT_2_TOKEN: ${CLINE_BOT_TOKEN:-${DESKTOP_BOT_TOKEN:-}}
      BOT_2_GOOSED_URL: "https://host.docker.internal:3001"
      BOT_2_GOOSED_SECRET: ${CLINE_SECRET_KEY:-${GOOSE_SERVER__SECRET_KEY:-}}
      BOT_2_TRUSTED_USERS: ${CLINE_TRUSTED_USERS:-${DESKTOP_TRUSTED_USERS:-}}
      BOT_2_NOTIFY_CHAT_IDS: ${CLINE_NOTIFY_CHAT_IDS:-${DESKTOP_NOTIFY_CHAT_IDS:-}}
      BOT_2_OBSERVE_PORT: "9092"

      # Bot 4 — Gemma → gemma-goosed (host network via host.docker.internal:3002)
      BOT_4_NAME: "Gemma"
      BOT_4_USERNAME: "s_gemma_bot"
      BOT_4_TOKEN: ${GEMMA_BOT_TOKEN:-}
      BOT_4_GOOSED_URL: "https://host.docker.internal:3002"
      BOT_4_GOOSED_SECRET: ${GEMMA_SECRET_KEY:-}
      BOT_4_TRUSTED_USERS: ${GEMMA_TRUSTED_USERS:-}
      BOT_4_NOTIFY_CHAT_IDS: ${GEMMA_NOTIFY_CHAT_IDS:-}
      BOT_4_OBSERVE_PORT: "9094"

      # Bot 3 — Goose → goosed local del usuario (host.docker.internal:42359)
      BOT_3_NAME: "Goose"
      BOT_3_USERNAME: "s_goose_bot"
      BOT_3_TOKEN: ${GOOSE_BOT_TOKEN:-}
      BOT_3_GOOSED_URL: ${GOOSE_LOCAL_URL:-https://host.docker.internal:42359}
      BOT_3_GOOSED_SECRET: ${GOOSE_SECRET_KEY:-${GOOSE_BOT_SECRET_KEY:-}}
      BOT_3_TRUSTED_USERS: ${GOOSE_TRUSTED_USERS:-${GOOSE_BOT_TRUSTED_USERS:-}}
      BOT_3_NOTIFY_CHAT_IDS: ${GOOSE_NOTIFY_CHAT_IDS:-${GOOSE_BOT_NOTIFY_CHAT_IDS:-}}
      BOT_3_OBSERVE_PORT: "9091"

      # ── Shared settings ─────────────────────────────────────────────────────
      LINA_DB_URL: postgresql://lina:${POSTGRES_PASSWORD:-lina_dev}@lina-db:5432/lina
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GATEWAY_PACER_TICK: "1.5"
      TELEGRAM_POLL_TIMEOUT: "30"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # ── Memory limits: 1 container para 3 bots = mismo que antes (512 MB)
    mem_limit: 512m
    memswap_limit: 512m

  # ─── Docker socket proxy (Tecnativa) ────────────────────────────────────────
  # Expone un subconjunto restringido del Docker daemon para que LINA pueda
  # arrancar/parar/reiniciar sus contenedores SIN tener acceso al socket completo.
  # Allowlist de endpoints:
  #   CONTAINERS: 1 + POST: 1 → GET /containers + start/stop/restart
  #   EXEC: 0  → sin docker exec (no escape de sandbox)
  #   BUILD: 0 → sin docker build (sin exfiltrar secrets vía Dockerfile)
  #   IMAGES: 0, NETWORKS: 0, VOLUMES: 0, SERVICES: 0
  # Referencia: https://github.com/Tecnativa/docker-socket-proxy
  lina-docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      SERVICES: 0
      TASKS: 0
      EXEC: 0
      BUILD: 0
      POST: 1    # permite start/stop/restart sobre contenedores
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - lina-docker-proxy-net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    mem_limit: 64m
    memswap_limit: 64m

  # ─── Monitoring Dashboard (Issue #156) ──────────────────────────────────────
  # Dashboard web unificado que muestra bots, sesiones activas, contenedores
  # y healthchecks de MCPs. Auto-refresh cada 30s.
  # Accesible en http://localhost:8090
  lina-dashboard:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.dashboard
    image: lina-dashboard:latest
    container_name: lina-dashboard
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      lina-mcp-gateway:
        condition: service_started
    environment:
      DASHBOARD_PORT: "8090"
      DASHBOARD_HOST: "0.0.0.0"
      # Observe ports (bot gateways → host.docker.internal si no están en host network)
      # LINA-gateway: 9093, CLINE-gateway: 9092, Goose-gateway: 9091
      # Usamos host.docker.internal para alcanzar servicios en host network
      MCP_HOST: "lina-mcp-gateway"
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 256m
    memswap_limit: 256m

volumes:
  lina-db-data:
  lina-logs:
  lina-secrets-data:
  lina-backup-data:
  lina-gcalendar-token:
  lina-goosed-sessions:

networks:
  default:
  lina-moodle-net:
    # Red dedicada para el MCP de Moodle — aisla el servicio del resto del
    # stack. NOTA: esto no restringe egress por dominio; para limitar tráfico
    # a *.utec.edu.uy se requieren reglas de firewall/iptables adicionales.
  lina-docker-proxy-net:
    # Red interna entre lina-docker-proxy y lina-mcp-shell-policy.
    # Sólo estos dos servicios la comparten — el socket proxy NO está en la red
    # default ni es accesible desde otros contenedores.
