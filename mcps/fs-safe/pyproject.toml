[project]
name = "lina-fs-safe"
version = "0.1.0"
description = "LINA MCP — filesystem con allowlist rígida y audit log."
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.2.0"]

[project.scripts]
lina-fs-safe = "lina_fs_safe.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lina_fs_safe"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
