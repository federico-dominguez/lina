[project]
name = "lina-secrets"
version = "0.1.0"
description = "LINA MCP — credenciales en system-keyring (libsecret/kwallet)."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "keyring>=25.0",
    "SecretStorage>=3.3 ; sys_platform == 'linux'",
    "jeepney>=0.8 ; sys_platform == 'linux'",
]

[project.scripts]
lina-secrets = "lina_secrets.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lina_secrets"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
omit = ["src/lina_secrets/cli.py"]

[tool.coverage.report]
fail_under = 65
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
