[project]
name = "lina-gitlab"
version = "0.1.0"
description = "LINA MCP — acceso a GitLab UTEC via REST API."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27",
    "keyring>=25",
]

[project.scripts]
lina-gitlab = "lina_gitlab.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lina_gitlab"]
