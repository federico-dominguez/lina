[project]
name = "lina-knowledge"
version = "0.1.0"
description = "LINA MCP — Unified Knowledge Store: RAG + Vector + Multi-Agent memory."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "pgvector>=0.3.6",
    "psycopg2-binary>=2.9",
]

[project.scripts]
lina-knowledge = "lina_knowledge.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lina_knowledge"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv]
dev-dependencies = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
