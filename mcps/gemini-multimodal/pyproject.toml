[project]
name = "lina-gemini-multimodal"
version = "0.1.0"
description = "LINA MCP — capacidades multimodales via Gemini Flash-Lite (audio, imagen, búsqueda web, documentos, generación de imágenes)."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "google-genai>=2.0.0",
]

[project.scripts]
lina-gemini-multimodal = "lina_gemini_multimodal.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lina_gemini_multimodal"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.report]
fail_under = 65
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
