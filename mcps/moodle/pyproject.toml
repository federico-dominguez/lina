[project]
name = "lina-moodle"
version = "0.1.0"
description = "LINA MCP — interactúa con Moodle vía REST API (cuestionarios, intentos, preguntas)"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.2.0"]

[project.scripts]
lina-moodle = "lina_moodle.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lina_moodle"]