[project]
name = "lina-shell-policy"
version = "0.1.0"
description = "LINA MCP — ejecuta comandos shell con policy (rechaza destructivos / sudo sin flag)."
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.2.0"]

[project.scripts]
lina-shell-policy = "lina_shell_policy.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lina_shell_policy"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.report]
fail_under = 65
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
