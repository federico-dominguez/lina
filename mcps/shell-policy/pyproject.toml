[project]
name = "lina-shell-policy"
version = "0.1.0"
description = "LINA MCP — ejecuta comandos shell con policy (rechaza destructivos / sudo sin flag)."
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.2.0"]

[project.scripts]
lina-shell-policy = "lina_shell_policy.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lina_shell_policy"]
