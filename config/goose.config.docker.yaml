# Configuración de goosed para entorno Docker.
# Este archivo se monta en el contenedor como /root/.config/goose/config.yaml
# y reemplaza la config del host.
# Los MCPs se conectan via SSE a través del nginx MCP gateway (lina-mcp-gateway).

GOOSE_TELEMETRY_ENABLED: "false"
GOOSE_MAX_TURNS: 1000
GOOSE_GATEWAY_MAX_TURNS: 50
GOOSE_SUBAGENT_MAX_TURNS: 200
GOOSE_CONTEXT_STRATEGY: summarize
GOOSE_DISABLE_AUTO_SESSION_TITLES: "true"
GOOSE_TOOL_CALL_CUTOFF: 50

extensions:
  # ─── Built-in / platform ────────────────────────────────────────────────────
  developer:          {enabled: true,  type: builtin,  name: developer,           display_name: Developer,           bundled: true}
  computercontroller: {enabled: true,  type: builtin,  name: computercontroller,  display_name: Computer Controller, bundled: true, timeout: 300}
  memory:             {enabled: true,  type: builtin,  name: memory,              display_name: Memory,              bundled: true, timeout: 300}
  todo:               {enabled: true,  type: platform, name: todo,                display_name: Todo,                bundled: true}
  extensionmanager:   {enabled: true,  type: platform, name: Extension Manager,   display_name: Extension Manager,   bundled: true}
  analyze:            {enabled: true,  type: platform, name: analyze,             display_name: Analyze,             bundled: true}
  summon:             {enabled: false, type: platform, name: summon,            display_name: Summon,              bundled: true}
  summarize:          {enabled: true,  type: platform, name: summarize,           display_name: Summarize,           bundled: true}
  tom:                {enabled: true,  type: platform, name: tom,                display_name: Top Of Mind,         bundled: true}

  # ─── MCPs de LINA — acceso vía streamable_http (lina-mcp-gateway:8101-8106) ──
  # El gateway nginx expone cada MCP en un puerto distinto dentro del network.
  # Dentro de Docker los nombres de servicio resuelven directamente.
  # goosed >= 1.35 requiere streamable_http (SSE deprecated).

  lina-secrets:
    name: lina-secrets
    display_name: LINA Secrets
    type: streamable_http
    uri: http://lina-mcp-gateway:8101/mcp
    enabled: true
    timeout: 30

  lina-fs-safe:
    name: lina-fs-safe
    display_name: LINA FS Safe
    type: streamable_http
    uri: http://lina-mcp-gateway:8102/mcp
    enabled: true
    timeout: 60

  lina-shell-policy:
    name: lina-shell-policy
    display_name: LINA Shell Policy
    type: streamable_http
    uri: http://lina-mcp-gateway:8103/mcp
    enabled: true
    timeout: 120

  lina-systemd-user:
    name: lina-systemd-user
    display_name: LINA Systemd User
    type: streamable_http
    uri: http://lina-mcp-gateway:8104/mcp
    enabled: true
    timeout: 30

  lina-moodle:
    name: lina-moodle
    display_name: LINA Moodle
    type: streamable_http
    uri: http://lina-mcp-gateway:8105/mcp
    enabled: true
    timeout: 120

  lina-db:
    name: lina-db
    display_name: LINA DB
    type: streamable_http
    uri: http://lina-mcp-gateway:8106/mcp
    enabled: true
    timeout: 30

  lina-knowledge:
    name: lina-knowledge
    display_name: LINA Knowledge
    type: streamable_http
    uri: http://lina-mcp-gateway:8112/mcp
    enabled: true
    timeout: 30

  # ─── MCPs legacy (ports 8107-8110) ──────────────────────────────────────────

  lina-github:
    name: lina-github
    display_name: LINA GitHub
    type: streamable_http
    uri: http://lina-mcp-gateway:8107/mcp
    enabled: true
    timeout: 60

  lina-gitlab:
    name: lina-gitlab
    display_name: LINA GitLab
    type: streamable_http
    uri: http://lina-mcp-gateway:8108/mcp
    enabled: true
    timeout: 60

  lina-gcalendar:
    name: lina-gcalendar
    display_name: LINA Google Calendar
    type: streamable_http
    uri: http://lina-mcp-gateway:8109/mcp
    enabled: true
    timeout: 60

  lina-gns3:
    name: lina-gns3
    display_name: LINA GNS3
    type: streamable_http
    uri: http://lina-mcp-gateway:8110/mcp
    enabled: true
    timeout: 60
  lina-wheel-of-life:
    name: lina-wheel-of-life
    display_name: LINA Wheel of Life
    type: streamable_http
    uri: http://lina-mcp-gateway:8113/mcp
    enabled: true
    timeout: 30
  lina-user-profile:
    name: lina-user-profile
    display_name: LINA User Profile
    type: streamable_http
    uri: http://lina-mcp-gateway:8114/mcp
    enabled: true
    timeout: 30

  lina-orchestrator:
    name: lina-orchestrator
    display_name: LINA Orchestrator
    type: streamable_http
    uri: http://lina-mcp-gateway:8111/mcp
    enabled: false
    timeout: 30

providers:
  custom_deepseek:
    enabled: true
    model: deepseek-v4-flash
    configured: true
active_provider: custom_deepseek
GOOSE_THINKING_EFFORT: false

# Sin gateway Telegram embebido — lo maneja lina-gateway (container separado)
gateway_configs: []
gateway_pairings: []
gateway_pending_codes: []
