[tool.pytest.ini_options]
# Configuración raíz usada por los tests de integración/E2E del repo.
# Los MCPs individuales tienen su propia configuración en mcps/*/pyproject.toml.
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
markers = [
    "integration: E2E integration tests that spawn real MCP subprocess (require uv sync)",
    "e2e_telegram: Telegram E2E tests — require a real Telegram account and a running Lina instance. Not run in CI by default.",
]
