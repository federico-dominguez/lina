name: Bug Report
description: Something is broken or LINA is behaving unexpectedly.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, check `just doctor` output and `just logs-tail 100`.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Send message "..."
        2. LINA calls tool X
        3. Error appears in logs
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Output of `just logs-tail 50` or relevant journalctl output.
      render: shell

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - goose / goosed
        - Telegram gateway
        - lina-secrets MCP
        - lina-fs-safe MCP
        - lina-shell-policy MCP
        - lina-systemd-user MCP
        - lina-moodle MCP
        - config / justfile
        - other
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: "`just doctor` was run and shows the issue"
        - label: "Thinking mode is still ON (not accidentally disabled)"
        - label: "No secrets appear in the logs I'm attaching"
