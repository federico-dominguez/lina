name: Feature Request
description: Propose a new capability, MCP, or improvement for LINA.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve? What can LINA do that she can't do now?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the desired behaviour. Include MCP design if relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you ruled out and why.

  - type: dropdown
    id: wave
    attributes:
      label: Roadmap wave
      description: Which wave does this belong to?
      options:
        - "Wave 2 — Self-extension"
        - "Wave 3 — Integrations"
        - "Wave 4 — Android"
        - "Wave 5 — Multi-agent"
        - "New wave / not categorized"

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: "This does not require disabling DeepSeek thinking mode"
        - label: "Secrets would be handled via lina-secrets MCP"
        - label: "New shell commands would go through lina-shell-policy"
