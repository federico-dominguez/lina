name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    name: Docker build — ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gateway
            dockerfile: deploy/docker/Dockerfile.gateway
            build_args: ""
          - image: mcp-fs-safe
            dockerfile: deploy/docker/Dockerfile.mcp
            build_args: "MCP_DIR=mcps/fs-safe\nMCP_CMD=lina-fs-safe"
          - image: mcp-lina-db
            dockerfile: deploy/docker/Dockerfile.mcp
            build_args: "MCP_DIR=mcps/lina-db\nMCP_CMD=lina-db"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: lina-${{ matrix.image }}:ci
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Report image size
        run: |
          SIZE=$(docker image inspect lina-${{ matrix.image }}:ci \
            --format '{{.Size}}' | awk '{printf "%.1f MB", $1/1048576}')
          echo "### Docker image size: ${{ matrix.image }}" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| lina-${{ matrix.image }} | $SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "Image size: $SIZE"

      - name: Size gate (hard cap 1 GB)
        run: |
          SIZE_BYTES=$(docker image inspect lina-${{ matrix.image }}:ci --format '{{.Size}}')
          MAX_BYTES=1073741824
          if [ "$SIZE_BYTES" -gt "$MAX_BYTES" ]; then
            echo "❌ Image lina-${{ matrix.image }} exceeds 1 GB: ${SIZE_BYTES} bytes"
            exit 1
          fi
          echo "✓ Size OK: ${SIZE_BYTES} bytes (< 1 GB)"

  dockerfile-lint:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: deploy/docker/Dockerfile.goosed
          ignore: DL3008,DL3009,DL3003,SC2164
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: deploy/docker/Dockerfile.mcp
          ignore: DL3008,DL3003,SC2164
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: deploy/docker/Dockerfile.gateway
          ignore: DL3008,DL3003,SC2164


  lint-and-test:
    name: Lint & Test MCPs
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - mcp: secrets
            cov_threshold: 65
          - mcp: fs-safe
            cov_threshold: 70
          - mcp: shell-policy
            cov_threshold: 65
          - mcp: systemd-user
            cov_threshold: 60
          - mcp: moodle
            cov_threshold: 18  # HTTP layer no es unit-testable sin mocks — excepción documentada en docs/architecture/0008-moodle-coverage-exception.md
          - mcp: lina-db
            cov_threshold: 65
          - mcp: github
            cov_threshold: 60
          - mcp: gitlab
            cov_threshold: 60
          - mcp: gcalendar
            cov_threshold: 60
          - mcp: gns3
            cov_threshold: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Sync dependencies — mcps/${{ matrix.mcp }}
        run: |
          cd mcps/${{ matrix.mcp }}
          uv sync --dev

      - name: Ruff lint — mcps/${{ matrix.mcp }}
        run: |
          cd mcps/${{ matrix.mcp }}
          uv run ruff check src/

      - name: Ruff format check — mcps/${{ matrix.mcp }}
        run: |
          cd mcps/${{ matrix.mcp }}
          uv run ruff format --check src/

      - name: Pytest + coverage — mcps/${{ matrix.mcp }}
        run: |
          cd mcps/${{ matrix.mcp }}
          uv run pytest tests/ -v --tb=short \
            --cov=src --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=${{ matrix.cov_threshold }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.mcp }}
          path: mcps/${{ matrix.mcp }}/coverage.xml

  validate-config:
    name: Validate config templates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check YAML syntax — mcp-registry
        run: python3 -c "import yaml; yaml.safe_load(open('config/mcp-registry.yaml'))"

      - name: Check .env.example has no real secrets
        run: |
          if grep -E '(sk-[a-zA-Z0-9]{32,}|[0-9]{10}:AA[a-zA-Z0-9_-]{33})' .env.example; then
            echo "ERROR: .env.example appears to contain real credentials"
            exit 1
          fi
          echo "✓ No real credentials found in .env.example"

      - name: Validate justfile syntax
        run: |
          sudo apt-get install -y just
          just --list > /dev/null && echo "✓ justfile parses OK"

  e2e-integration:
    name: E2E integration tests (stdio)
    runs-on: ubuntu-24.04
    needs: lint-and-test
    if: success() || failure()  # run even if some unit tests fail

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Sync all MCPs (needed for E2E subprocess invocation)
        run: |
          for mcp in fs-safe secrets shell-policy systemd-user moodle lina-db; do
            uv sync --dev --project mcps/$mcp
          done

      - name: Install E2E test dependencies
        run: pip install pytest pytest-asyncio

      - name: E2E integration tests
        run: |
          pytest tests/integration/mcps/ -v --tb=short -m integration

  lint-and-test-gateway:
    name: Lint & Test gateway
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Sync dependencies
        run: cd infrastructure/gateway/telegram && uv sync --dev

      - name: Ruff lint
        run: cd infrastructure/gateway/telegram && uv run ruff check src/

      - name: Ruff format check
        run: cd infrastructure/gateway/telegram && uv run ruff format --check src/

      - name: Pytest + coverage
        run: |
          cd infrastructure/gateway/telegram
          uv run pytest tests/ -v --tb=short \
            --cov=src --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=40
