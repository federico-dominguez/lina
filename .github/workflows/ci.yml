name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Docker build — todas las imágenes del docker-compose + size gates
  # ═══════════════════════════════════════════════════════════════════════
  docker-build:
    name: Docker build — ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Imagen principal (goosed runtime + MCPs Python) ───────────
          - image: goosed
            dockerfile: deploy/docker/Dockerfile.goosed
            build_args: ""
            size_limit_mb: 1500
            required_bin: bin/goosed-linux-amd64

          # ── Gateway ──────────────────────────────────────────────────
          - image: gateway
            dockerfile: deploy/docker/Dockerfile.gateway
            build_args: ""
            size_limit_mb: 800
            required_bin: ""

          # ── MCPs (Dockerfile.mcp compartido) ─────────────────────────
          - image: mcp-secrets
            dockerfile: deploy/docker/Dockerfile.mcp
            build_args: "MCP_DIR=mcps/secrets\nMCP_CMD=lina-secrets"
            size_limit_mb: 500
            required_bin: ""
          - image: mcp-fs-safe
            dockerfile: deploy/docker/Dockerfile.mcp
            build_args: "MCP_DIR=mcps/fs-safe\nMCP_CMD=lina-fs-safe"
            size_limit_mb: 500
            required_bin: ""
          - image: mcp-shell-policy
            dockerfile: deploy/docker/Dockerfile.mcp
            build_args: "MCP_DIR=mcps/shell-policy\nMCP_CMD=lina-shell-policy"
            size_limit_mb: 500
            required_bin: ""
          - image: mcp-systemd-user
            dockerfile: deploy/docker/Dockerfile.mcp
            build_args: "MCP_DIR=mcps/systemd-user\nMCP_CMD=lina-systemd-user"
            size_limit_mb: 500
            required_bin: ""
          - image: mcp-moodle
            dockerfile: deploy/docker/Dockerfile.mcp
            build_args: "MCP_DIR=mcps/moodle\nMCP_CMD=lina-moodle"
            size_limit_mb: 500
            required_bin: ""
          - image: mcp-lina-db
            dockerfile: deploy/docker/Dockerfile.mcp
            build_args: "MCP_DIR=mcps/lina-db\nMCP_CMD=lina-db"
            size_limit_mb: 500
            required_bin: ""
          - image: mcp-github
            dockerfile: deploy/docker/Dockerfile.mcp
            build_args: "MCP_DIR=mcps/github\nMCP_CMD=lina-github"
            size_limit_mb: 500
            required_bin: ""
          - image: mcp-gitlab
            dockerfile: deploy/docker/Dockerfile.mcp
            build_args: "MCP_DIR=mcps/gitlab\nMCP_CMD=lina-gitlab"
            size_limit_mb: 500
            required_bin: ""
          - image: mcp-gcalendar
            dockerfile: deploy/docker/Dockerfile.mcp
            build_args: "MCP_DIR=mcps/gcalendar\nMCP_CMD=lina-gcalendar"
            size_limit_mb: 500
            required_bin: ""
          - image: mcp-gns3
            dockerfile: deploy/docker/Dockerfile.mcp
            build_args: "MCP_DIR=mcps/gns3\nMCP_CMD=lina-gns3"
            size_limit_mb: 500
          - image: mcp-orchestrator
            dockerfile: deploy/docker/Dockerfile.mcp
            build_args: "MCP_DIR=mcps/orchestrator\nMCP_CMD=lina-orchestrator"
            size_limit_mb: 500
            required_bin: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check required binary
        id: check_bin
        run: |
          if [ -n "${{ matrix.required_bin }}" ]; then
            if [ -f "${{ matrix.required_bin }}" ]; then
              echo "binary_found=true" >> $GITHUB_OUTPUT
              echo "✓ ${{ matrix.required_bin }} encontrado"
            else
              echo "binary_found=false" >> $GITHUB_OUTPUT
              echo "⚠️ ${{ matrix.required_bin }} no encontrado — saltando build"
            fi
          else
            echo "binary_found=true" >> $GITHUB_OUTPUT
          fi

      - name: Build image
        if: steps.check_bin.outputs.binary_found == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: lina-${{ matrix.image }}:ci
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Report image size
        if: steps.check_bin.outputs.binary_found == 'true'
        run: |
          SIZE_BYTES=$(docker image inspect lina-${{ matrix.image }}:ci --format '{{.Size}}')
          SIZE_MB=$(awk "BEGIN {printf \"%.1f\", $SIZE_BYTES/1048576}")
          LIMIT_MB=${{ matrix.size_limit_mb }}
          echo "### Docker image: ${{ matrix.image }}" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Size | ${SIZE_MB} MB |" >> $GITHUB_STEP_SUMMARY
          echo "| Limit | ${LIMIT_MB} MB |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | $([ $(awk "BEGIN {print ($SIZE_BYTES > $LIMIT_MB*1048576)}") = 1 ] && echo '❌ OVER LIMIT' || echo '✅ OK') |" >> $GITHUB_STEP_SUMMARY

      - name: Size gate
        if: steps.check_bin.outputs.binary_found == 'true'
        run: |
          SIZE_BYTES=$(docker image inspect lina-${{ matrix.image }}:ci --format '{{.Size}}')
          MAX_BYTES=$(( ${{ matrix.size_limit_mb }} * 1048576 ))
          echo "Image: lina-${{ matrix.image }} — ${SIZE_BYTES} bytes (limit: ${MAX_BYTES})"
          if [ "$SIZE_BYTES" -gt "$MAX_BYTES" ]; then
            echo "❌ FAIL: lina-${{ matrix.image }} excede límite de ${{ matrix.size_limit_mb }} MB"
            exit 1
          fi
          echo "✅ PASS: dentro del límite de ${{ matrix.size_limit_mb }} MB"

  # ═══════════════════════════════════════════════════════════════════════
  # Dockerfile lint (hadolint)
  # ═══════════════════════════════════════════════════════════════════════
  dockerfile-lint:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: deploy/docker/Dockerfile.goosed
          ignore: DL3008,DL3009,DL3003,DL3013,DL3059,SC2164
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: deploy/docker/Dockerfile.mcp
          ignore: DL3008,DL3003,SC2164
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: deploy/docker/Dockerfile.gateway
          ignore: DL3008,DL3003,SC2164

  # ═══════════════════════════════════════════════════════════════════════
  # Lint & Test — todos los MCPs
  # ═══════════════════════════════════════════════════════════════════════
  lint-and-test:
    name: Lint & Test ${{ matrix.mcp }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - mcp: secrets
            cov_threshold: 65
          - mcp: fs-safe
            cov_threshold: 70
          - mcp: shell-policy
            cov_threshold: 65
          - mcp: systemd-user
            cov_threshold: 60
          - mcp: moodle
            cov_threshold: 18
          - mcp: lina-db
            cov_threshold: 65
          - mcp: github
            cov_threshold: 60
          - mcp: gitlab
            cov_threshold: 60
          - mcp: gcalendar
            cov_threshold: 60
          - mcp: gns3
            cov_threshold: 60
          - mcp: orchestrator
            cov_threshold: 75
          - mcp: wheel-of-life
            cov_threshold: 15
          - mcp: user-profile
            cov_threshold: 15
          - mcp: google-fit
            cov_threshold: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Sync dependencies — mcps/${{ matrix.mcp }}
        run: |
          cd mcps/${{ matrix.mcp }}
          uv sync --dev

      - name: Ruff lint — mcps/${{ matrix.mcp }}
        run: |
          cd mcps/${{ matrix.mcp }}
          uv run ruff check src/

      - name: Ruff format check — mcps/${{ matrix.mcp }}
        run: |
          cd mcps/${{ matrix.mcp }}
          uv run ruff format --check src/

      - name: Pytest + coverage — mcps/${{ matrix.mcp }}
        run: |
          cd mcps/${{ matrix.mcp }}
          uv run pytest tests/ -v --tb=short \
            --cov=src --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=${{ matrix.cov_threshold }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.mcp }}
          path: mcps/${{ matrix.mcp }}/coverage.xml

  # ═══════════════════════════════════════════════════════════════════════
  # Config validation
  # ═══════════════════════════════════════════════════════════════════════
  validate-config:
    name: Validate config templates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check YAML syntax — mcp-registry
        run: python3 -c "import yaml; yaml.safe_load(open('config/mcp-registry.yaml'))"

      - name: Check .env.example has no real secrets
        run: |
          if grep -E '(sk-[a-zA-Z0-9]{32,}|[0-9]{10}:AA[a-zA-Z0-9_-]{33})' .env.example; then
            echo "ERROR: .env.example appears to contain real credentials"
            exit 1
          fi
          echo "✓ No real credentials found in .env.example"

      - name: Validate justfile syntax
        run: |
          sudo apt-get install -y just
          just --list > /dev/null && echo "✓ justfile parses OK"

  # ═══════════════════════════════════════════════════════════════════════
  # E2E integration tests
  # ═══════════════════════════════════════════════════════════════════════
  e2e-integration:
    name: E2E integration tests
    runs-on: ubuntu-24.04
    needs: lint-and-test
    if: success() || failure()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Sync all MCPs
        run: |
          for mcp in fs-safe secrets shell-policy systemd-user moodle lina-db; do
            uv sync --dev --project mcps/$mcp
          done

      - name: Install E2E test dependencies
        run: pip install pytest pytest-asyncio

      - name: E2E integration tests
        run: |
          pytest tests/integration/mcps/ -v --tb=short -m integration

  # ═══════════════════════════════════════════════════════════════════════
  # Lint & Test — gateway
  # ═══════════════════════════════════════════════════════════════════════
  lint-and-test-gateway:
    name: Lint & Test gateway
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Sync dependencies
        run: cd infrastructure/gateway/telegram && uv sync --dev

      - name: Ruff lint
        run: cd infrastructure/gateway/telegram && uv run ruff check src/

      - name: Ruff format check
        run: cd infrastructure/gateway/telegram && uv run ruff format --check src/

      - name: Pytest + coverage
        run: |
          cd infrastructure/gateway/telegram
          uv run pytest tests/ -v --tb=short \
            --cov=src --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=40
