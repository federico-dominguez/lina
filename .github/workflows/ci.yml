name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ── Docker images matrix ────────────────────────────────────────────────────
#
# Cada imagen que se buildea en docker-compose aparece acá.
# Si agregás una nueva MCP: añadí una entrada al matrix con su dockerfile y
# MCP_DIR (si aplica). Los tags de caché GHA son por imagen.
#
# Size gates:
#   mcp     → 400 MB (python + uv + dependencias)
#   gateway → 300 MB (python + httpx + asyncpg)
#   goosed  → 800 MB (go binary + uv + python + 3.5 GB MCPs)

jobs:
  docker-build:
    name: Docker build — ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: goosed
            dockerfile: deploy/docker/Dockerfile.goosed
            build_args: ""
            max_size_mb: 800

          - image: gateway
            dockerfile: deploy/docker/Dockerfile.gateway
            build_args: ""
            max_size_mb: 300

          - image: mcp-secrets
            dockerfile: deploy/docker/Dockerfile.mcp
            build_args: "MCP_DIR=mcps/secrets\nMCP_CMD=lina-secrets"
            max_size_mb: 400
          - image: mcp-fs-safe
            dockerfile: deploy/docker/Dockerfile.mcp
            build_args: "MCP_DIR=mcps/fs-safe\nMCP_CMD=lina-fs-safe"
            max_size_mb: 400
          - image: mcp-shell-policy
            dockerfile: deploy/docker/Dockerfile.mcp
            build_args: "MCP_DIR=mcps/shell-policy\nMCP_CMD=lina-shell-policy"
            max_size_mb: 400
          - image: mcp-systemd-user
            dockerfile: deploy/docker/Dockerfile.mcp
            build_args: "MCP_DIR=mcps/systemd-user\nMCP_CMD=lina-systemd-user"
            max_size_mb: 400
          - image: mcp-moodle
            dockerfile: deploy/docker/Dockerfile.mcp
            build_args: "MCP_DIR=mcps/moodle\nMCP_CMD=lina-moodle"
            max_size_mb: 400
          - image: mcp-lina-db
            dockerfile: deploy/docker/Dockerfile.mcp
            build_args: "MCP_DIR=mcps/lina-db\nMCP_CMD=lina-db"
            max_size_mb: 400
          - image: mcp-github
            dockerfile: deploy/docker/Dockerfile.mcp
            build_args: "MCP_DIR=mcps/github\nMCP_CMD=lina-github"
            max_size_mb: 400
          - image: mcp-gitlab
            dockerfile: deploy/docker/Dockerfile.mcp
            build_args: "MCP_DIR=mcps/gitlab\nMCP_CMD=lina-gitlab"
            max_size_mb: 400
          - image: mcp-gcalendar
            dockerfile: deploy/docker/Dockerfile.mcp
            build_args: "MCP_DIR=mcps/gcalendar\nMCP_CMD=lina-gcalendar"
            max_size_mb: 400
          - image: mcp-gns3
            dockerfile: deploy/docker/Dockerfile.mcp
            build_args: "MCP_DIR=mcps/gns3\nMCP_CMD=lina-gns3"
            max_size_mb: 400
          - image: mcp-orchestrator
            dockerfile: deploy/docker/Dockerfile.mcp
            build_args: "MCP_DIR=mcps/orchestrator\nMCP_CMD=lina-orchestrator"
            max_size_mb: 400

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: lina-${{ matrix.image }}:ci
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Report image size
        run: |
          SIZE=$(docker image inspect lina-${{ matrix.image }}:ci \
            --format '{{.Size}}' | awk '{printf "%.1f MB", $1/1048576}')
          MAX=${{ matrix.max_size_mb }}
          echo "### Docker image size: ${{ matrix.image }}" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Size | Max |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| lina-${{ matrix.image }} | $SIZE | ${MAX} MB |" >> $GITHUB_STEP_SUMMARY
          echo "Image size: $SIZE (max ${MAX} MB)"

      - name: Size gate
        run: |
          SIZE_BYTES=$(docker image inspect lina-${{ matrix.image }}:ci --format '{{.Size}}')
          MAX_BYTES=$(( ${{ matrix.max_size_mb }} * 1048576 ))
          if [ "$SIZE_BYTES" -gt "$MAX_BYTES" ]; then
            MB=$(echo "scale=1; $SIZE_BYTES / 1048576" | bc)
            echo "❌ lina-${{ matrix.image }} excede el límite: ${MB} MB > ${{ matrix.max_size_mb }} MB"
            exit 1
          fi
          echo "✓ Size OK: $(echo "scale=1; $SIZE_BYTES / 1048576" | bc) MB (< ${{ matrix.max_size_mb }} MB)"

  # ── Aggregate size report ─────────────────────────────────────────────
  docker-size-report:
    name: Docker size report
    needs: docker-build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate size report
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 📦 Docker Image Size Report

          | Image | Size | Limit | Status |
          |---|---|---|---|
          EOF
          echo "✅ Full size report generated"

  # ── Dockerfile lint ───────────────────────────────────────────────────
  dockerfile-lint:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: deploy/docker/Dockerfile.goosed
          ignore: DL3008,DL3009,DL3003,SC2164
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: deploy/docker/Dockerfile.mcp
          ignore: DL3008,DL3003,SC2164
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: deploy/docker/Dockerfile.gateway
          ignore: DL3008,DL3003,SC2164

  # ── Ling & Test MCPs ──────────────────────────────────────────────────
  lint-and-test:
    name: Lint & Test MCPs
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - mcp: secrets
            cov_threshold: 65
          - mcp: fs-safe
            cov_threshold: 70
          - mcp: shell-policy
            cov_threshold: 65
          - mcp: systemd-user
            cov_threshold: 60
          - mcp: moodle
            cov_threshold: 18
          - mcp: lina-db
            cov_threshold: 65
          - mcp: github
            cov_threshold: 60
          - mcp: gitlab
            cov_threshold: 60
          - mcp: gcalendar
            cov_threshold: 60
          - mcp: gns3
            cov_threshold: 60
          - mcp: orchestrator
            cov_threshold: 80

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Sync dependencies — mcps/${{ matrix.mcp }}
        run: |
          cd mcps/${{ matrix.mcp }}
          uv sync --dev

      - name: Ruff lint — mcps/${{ matrix.mcp }}
        run: |
          cd mcps/${{ matrix.mcp }}
          uv run ruff check src/

      - name: Ruff format check — mcps/${{ matrix.mcp }}
        run: |
          cd mcps/${{ matrix.mcp }}
          uv run ruff format --check src/

      - name: Pytest + coverage — mcps/${{ matrix.mcp }}
        run: |
          cd mcps/${{ matrix.mcp }}
          uv run pytest tests/ -v --tb=short \
            --cov=src --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=${{ matrix.cov_threshold }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.mcp }}
          path: mcps/${{ matrix.mcp }}/coverage.xml

  # ── Validate config templates ─────────────────────────────────────────
  validate-config:
    name: Validate config templates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check YAML syntax — mcp-registry
        run: python3 -c "import yaml; yaml.safe_load(open('config/mcp-registry.yaml'))"

      - name: Check .env.example has no real secrets
        run: |
          if grep -E '(sk-[a-zA-Z0-9]{32,}|[0-9]{10}:AA[a-zA-Z0-9_-]{33})' .env.example; then
            echo "ERROR: .env.example appears to contain real credentials"
            exit 1
          fi
          echo "✓ No real credentials found in .env.example"

      - name: Validate justfile syntax
        run: |
          sudo apt-get install -y just
          just --list > /dev/null && echo "✓ justfile parses OK"

  # ── E2E integration tests ─────────────────────────────────────────────
  e2e-integration:
    name: E2E integration tests (stdio)
    runs-on: ubuntu-24.04
    needs: lint-and-test
    if: success() || failure()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Sync all MCPs (needed for E2E subprocess invocation)
        run: |
          for mcp in fs-safe secrets shell-policy systemd-user moodle lina-db; do
            uv sync --dev --project mcps/$mcp
          done

      - name: Install E2E test dependencies
        run: pip install pytest pytest-asyncio

      - name: E2E integration tests
        run: |
          pytest tests/integration/mcps/ -v --tb=short -m integration

  # ── Lint &Test gateway ────────────────────────────────────────────────
  lint-and-test-gateway:
    name: Lint & Test gateway
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Sync dependencies
        run: cd infrastructure/gateway/telegram && uv sync --dev

      - name: Ruff lint
        run: cd infrastructure/gateway/telegram && uv run ruff check src/

      - name: Ruff format check
        run: cd infrastructure/gateway/telegram && uv run ruff format --check src/

      - name: Pytest + coverage
        run: |
          cd infrastructure/gateway/telegram
          uv run pytest tests/ -v --tb=short \
            --cov=src --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=40
